name: Release

on:
  schedule:
    # Mondays and Thursdays at 22:00 UTC
    - cron: "0 22 * * 1,4"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PATHS: >-
    pdsmigration-common
    pdsmigration-gui
    Cargo.toml
    Cargo.lock
    rust-toolchain.toml

jobs:
  check:
    name: Check for desktop application changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.should_release }}
      tag: ${{ steps.diff.outputs.tag }}
      title: ${{ steps.diff.outputs.title }}
      notes: ${{ steps.diff.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main against the most recent release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            RANGE="$PREV_TAG..HEAD"
          else
            echo "No usable previous release tag, comparing against the full history"
            RANGE="HEAD"
          fi

          COMMITS="$(git log --no-merges --format='- %s (%h)' $RANGE -- $RELEASE_PATHS)"
          if [ -z "$COMMITS" ]; then
            echo "No desktop application changes since ${PREV_TAG:-the first commit}, skipping the release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(grep -m1 '^version = ' pdsmigration-gui/Cargo.toml | cut -d'"' -f2)"
          # The patch version is replaced by the release date (with a suffix if necessary)
          BASE="v${VERSION%.*}.$(date -u +%Y%m%d)"
          TAG="$BASE"
          N=1
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            TAG="$BASE+$N"
            N=$((N + 1))
          done

          {
            echo "should_release=true"
            echo "tag=$TAG"
            echo "title=$TAG - Desktop application"
            echo "notes<<EOF_NOTES"
            echo "## Changes"
            echo ""
            echo "$COMMITS"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            archive: zip
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile
        id: compile
        uses: rust-build/rust-build.action@6febf1b0ed6499a46610b58ef9d810398e75f3c2 # v1.4.5
        with:
          RUSTTARGET: ${{ matrix.target }}
          ARCHIVE_TYPES: ${{ matrix.archive }}
          SRC_DIR: "pdsmigration-gui"
          UPLOAD_MODE: none
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: |
            ${{ steps.compile.outputs.BUILT_ARCHIVE }}
            ${{ steps.compile.outputs.BUILT_CHECKSUM }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
