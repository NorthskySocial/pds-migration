name: Release

on:
  schedule:
    # Mondays and Thursdays at 22:00 UTC
    - cron: "0 22 * * 1,4"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PATHS: >-
    pdsmigration-common
    pdsmigration-gui
    Cargo.toml
    Cargo.lock
    rust-toolchain.toml

jobs:
  check:
    name: Check for desktop application changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.should_release }}
      tag: ${{ steps.diff.outputs.tag }}
      title: ${{ steps.diff.outputs.title }}
      notes: ${{ steps.diff.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main against the most recent release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            RANGE="$PREV_TAG..HEAD"
          else
            echo "No usable previous release tag, comparing against the full history"
            RANGE="HEAD"
          fi

          COMMITS="$(git log --no-merges --format='- %s (%h)' $RANGE -- $RELEASE_PATHS)"
          if [ -z "$COMMITS" ]; then
            echo "No desktop application changes since ${PREV_TAG:-the first commit}, skipping the release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          # The patch version is replaced by the release date (with a suffix if necessary)
          BASE="v${VERSION%.*}.$(date -u +%Y%m%d)"
          TAG="$BASE"
          N=1
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            TAG="$BASE+$N"
            N=$((N + 1))
          done

          {
            echo "should_release=true"
            echo "tag=$TAG"
            echo "title=$TAG - Desktop application"
            echo "notes<<EOF_NOTES"
            echo "## Changes"
            echo ""
            echo "$COMMITS"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-linux
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build binary and Debian package
        run: |
          set -euo pipefail
          cargo build -p pdsmigration-gui --release
          cargo deb -p pdsmigration-gui --no-build --output dist/
          cp target/release/pdsmigration-gui dist/pdsmigration-gui-linux-x86_64
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows
      - name: Build binary
        run: cargo build -p pdsmigration-gui --release
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows
          path: target/release/pdsmigration-gui.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
